name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt-version: '5.15.2'
          - os: ubuntu-latest
            qt-version: '6.8.0'
          - os: windows-latest
            qt-version: '5.15.2'
          - os: windows-latest
            qt-version: '6.8.0'
          - os: macos-latest
            qt-version: '6.9.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          cache: true

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DYJDRAGGRID_BUILD_DEMO=OFF"
          if [ "${{ runner.os }}" = "macOS" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          fi
          cmake -S . -B build $CMAKE_ARGS

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --config Release

      - name: Install (Unix)
        if: runner.os != 'Windows'
        run: cmake --install build --prefix build/install

      - name: Configure installed consumer (Unix)
        if: runner.os != 'Windows'
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install"

      - name: Build installed consumer (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build/consumer --config Release

      # consumer 的返回码承载断言（columnCount == 2），只构建不运行
      # 等于从未验证过安装产物可用。
      - name: Run installed consumer (Unix)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/consumer/YJDragGridConsumer

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DYJDRAGGRID_BUILD_DEMO=OFF

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: cmake --install build --prefix build/install --config Release

      - name: Configure installed consumer (Windows)
        if: runner.os == 'Windows'
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install"

      - name: Build installed consumer (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build/consumer --config Release

      - name: Test (Unix)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -C Release

  # 示例程序不属于库的构建产物，但它是 dragHandle / QScrollArea 唯一的集成样例。
  # 单独跑一个 job，避免示例随 API 演进而无人编译。
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          cache: true

      - name: Configure examples
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DYJDRAGGRID_BUILD_EXAMPLES=ON -DYJDRAGGRID_BUILD_TESTS=OFF

      - name: Build examples
        run: cmake --build build --config Release
